worker_processes auto;
pid /run/nginx-online-shop.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    access_log /var/log/nginx/online-shop-access.log;
    error_log /var/log/nginx/online-shop-error.log;

    upstream auth_service {
        server 127.0.0.1:8001;
    }

    upstream product_service {
        server 127.0.0.1:8002;
    }

    upstream order_service {
        server 127.0.0.1:8003;
    }

    server {
        listen 8080;
        server_name _;

        # CORS headers for local Vite frontend
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. Serve uploaded product images directly from disk
        location /static/uploads/ {
            alias /home/midium/Documents/WebPractice/online-shop-microservices-nginx/product-service/app/static/uploads/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # 2. Auth Service routes (/auth/register, /auth/login, /auth/me, /auth/admin/*, /auth/docs)
        location /auth/ {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 3. Product Service routes (Products & Categories)
        location /products/ {
            proxy_pass http://product_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /categories/ {
            proxy_pass http://product_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 4. Order Service routes
        location /orders/ {
            proxy_pass http://order_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # 5. Gateway health check
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx"}';
        }
    }
}